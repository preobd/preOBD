; boards/teensy40/board.ini — PlatformIO env fragment for Teensy 4.0.
; Merged via `extra_configs = boards/*/board.ini`. Pairs with board.h (facts)
; and wiring.ini (your gitignored pins) in this folder.

[env:teensy40]
platform = teensy
board = teensy40
upload_protocol = teensy-cli
build_flags =
    -include boards/teensy40/board.h     ; board definition (facts) — must precede resolve.h
    -include boards/resolve.h            ; derives INCLUDE_* from SUPPORTS_* + wiring
    ${teensy40.wiring}                   ; your wiring (gitignored wiring.ini overrides the default below)
    -D TEENSY_40
    -D USE_FLEXCAN_NATIVE
    -O2
    -Wall
lib_deps =
    ${display_libs.lib_deps}
    ${sensor_libs.lib_deps}
    ${eeprom_libs.lib_deps}
    ${cli_libs.lib_deps}
    https://github.com/tonton81/FlexCAN_T4.git

; Empty wiring default so ${teensy40.wiring} resolves cleanly with no overlay.
; wiring.ini (gitignored) overrides this key with -D pin flags.
[teensy40]
wiring =
