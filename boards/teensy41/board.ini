; boards/teensy41/board.ini — PlatformIO env fragment for Teensy 4.1.
; Merged into the build via `extra_configs = boards/*/board.ini` in platformio.ini.
; Pairs with board.h (facts) and wiring.ini (your gitignored pins) in this folder.

[env:teensy41]
platform = teensy
board = teensy41
upload_protocol = teensy-cli
build_flags =
    -include boards/teensy41/board.h     ; board definition (facts) — must precede resolve.h
    -include boards/resolve.h            ; derives INCLUDE_* from SUPPORTS_* + wiring
    ${teensy41.wiring}                   ; your wiring (gitignored wiring.ini overrides the default below)
    -D USE_FLEXCAN_NATIVE
    -O2
    -Wall
lib_deps =
    ${display_libs.lib_deps}
    ${sensor_libs.lib_deps}
    ${eeprom_libs.lib_deps}
    ${cli_libs.lib_deps}
    https://github.com/tonton81/FlexCAN_T4.git

; Bench/debug build of the same board: the release optimisation (-O2) plus full
; debug symbols, so addr2line (tools/watchdog_bench.py where) gives file:line, and
; the watchdog stall command (#543). Shares board.h / resolve.h / wiring.
;
; Not -Og (#544): an -Og image of this firmware never reaches USB enumeration
; on a Teensy 4.1 (hangs in startup; recovering needs the program button). Not
; `build_type = debug` either: even at -O2 it grew .data by 12 KB and overflowed
; RAM1. So: the ordinary release build plus -g, i.e. the same code as teensy41
; with symbols. (The old -D DEBUG CAN prints also overflow RAM1 at -O2.)
[env:debug]
platform = teensy
board = teensy41
build_flags =
    -include boards/teensy41/board.h
    -include boards/resolve.h
    ${teensy41.wiring}
    -D USE_FLEXCAN_NATIVE
    -D INCLUDE_WATCHDOG_STALL=1
    -O2
    -g
    -Wall
    -Wextra
lib_deps =
    ${display_libs.lib_deps}
    ${sensor_libs.lib_deps}
    ${eeprom_libs.lib_deps}
    ${cli_libs.lib_deps}
    https://github.com/tonton81/FlexCAN_T4.git

; Empty wiring default so ${teensy41.wiring} resolves cleanly with no overlay.
; wiring.ini (gitignored) overrides this key with -D pin flags.
[teensy41]
wiring =
