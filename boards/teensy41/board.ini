; boards/teensy41/board.ini — PlatformIO env fragment for Teensy 4.1.
; Merged into the build via `extra_configs = boards/*/board.ini` in platformio.ini.
; Pairs with board.h (facts) and wiring.ini (your gitignored pins) in this folder.

[env:teensy41]
platform = teensy
board = teensy41
upload_protocol = teensy-cli
build_flags =
    -include boards/teensy41/board.h     ; board definition (facts) — must precede resolve.h
    -include boards/resolve.h            ; derives wired ENABLE_* from board + wiring pins
    ${teensy41.wiring}                   ; your wiring (gitignored wiring.ini overrides the default below)
    -D TEENSY_41
    -D USE_FLEXCAN_NATIVE
    -O2
    -Wall
lib_deps =
    ${display_libs.lib_deps}
    ${sensor_libs.lib_deps}
    ${eeprom_libs.lib_deps}
    ${cli_libs.lib_deps}
    https://github.com/tonton81/FlexCAN_T4.git
    https://github.com/tonton81/WDT_T4.git

; Debug build of the same board (symbols + -Og), shares board.h / resolve.h / wiring.
[env:debug]
platform = teensy
board = teensy41
build_type = debug
build_flags =
    -include boards/teensy41/board.h
    -include boards/resolve.h
    ${teensy41.wiring}
    -D TEENSY_41
    -D USE_FLEXCAN_NATIVE
    -D DEBUG
    -Og
    -g
    -Wall
    -Wextra
lib_deps =
    ${display_libs.lib_deps}
    ${sensor_libs.lib_deps}
    ${eeprom_libs.lib_deps}
    ${cli_libs.lib_deps}
    https://github.com/tonton81/FlexCAN_T4.git
    https://github.com/tonton81/WDT_T4.git

; Empty wiring default so ${teensy41.wiring} resolves cleanly with no overlay.
; wiring.ini (gitignored) overrides this key with -D pin flags.
[teensy41]
wiring =
