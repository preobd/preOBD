; boards/mega2560/board.ini — PlatformIO env fragment for Arduino Mega 2560.
; Merged via `extra_configs = boards/*/board.ini`. Pairs with board.h (facts)
; and wiring.ini (your gitignored pins) in this folder.

[env:mega2560]
platform = atmelavr
board = megaatmega2560
build_flags =
    -include boards/mega2560/board.h     ; board definition (facts) — must precede resolve.h
    -include boards/resolve.h            ; derives INCLUDE_* from SUPPORTS_* + wiring
    -include boards/avr_pstr_merge.h     ; fold duplicate F()/PSTR strings: PROGMEM must fit the low 64 KB (#523)
    ${mega2560.wiring}                   ; your wiring (gitignored wiring.ini overrides the default below)
    -D ARDUINO_MEGA
    ; Framework ring-buffer tuning — must be real -D flags (not in board.h) because
    ; -include does not reach core TUs (HardwareSerial). 4 UARTs × (64→16 TX +
    ; 64→32 RX) saves ~192 B. (-D BUFFER_LENGTH for Wire is ineffective — AVR
    ; Wire.h hard-codes it without an #ifndef guard.)
    -D SERIAL_TX_BUFFER_SIZE=16
    -D SERIAL_RX_BUFFER_SIZE=32
    -O2
    ; GCC turns dense switches into lookup tables (CSWTCH.*), and avr-gcc
    ; puts them in .data: 218 B of RAM here, 19 tables. Without them: -210 B
    ; RAM, +512 B flash (measured, #509). RAM is the Mega's limit, not flash.
    -fno-tree-switch-conversion
    -Wall
lib_deps =
    ${display_libs.lib_deps}
    ${can_libs.lib_deps}
    ${sensor_libs.lib_deps}
    ${cli_libs.lib_deps}

; Empty wiring default so ${mega2560.wiring} resolves cleanly with no overlay.
[mega2560]
wiring =
