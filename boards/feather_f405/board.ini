; boards/feather_f405/board.ini — PlatformIO env fragment for the Adafruit
; Feather STM32F405 Express. Merged via `extra_configs = boards/*/board.ini`.
; Pairs with board.h (facts) and wiring.ini (your gitignored pins) in this folder.
;
; v1 PCB candidate MCU (#100): this target also produces the RAM-gate figures in
; preOBD-hardware docs/v1-requirements.md "MCU decision".

[env:feather_f405]
platform = ststm32
board = adafruit_feather_f405
upload_protocol = dfu
; Sector 11 (the last 128 KB) holds the config store (board.h EEPROM_FLASH_*):
; keep the image out of it. The core's ldscript takes its flash size from this.
board_upload.maximum_size = 917504
build_flags =
    -include boards/feather_f405/board.h ; board definition (facts) — must precede resolve.h
    -include boards/resolve.h            ; derives INCLUDE_* from SUPPORTS_* + wiring
    ${feather_f405.wiring}               ; your wiring (gitignored wiring.ini overrides the default below)
    ${feather_f405.adc_sampling}         ; ADC sample time (core TU flag; wiring.ini may override)
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC  ; USB CDC serial — the CLI port (the builder adds USBCON)
    -D ENABLE_HWSERIAL6                  ; USART6 on D5/D6 = preOBD Serial2 (core TU flag)
    -D SERIAL_RX_BUFFER_SIZE=1024        ; nRF link bulk inbound (#449); applies to every core UART
    -Wl,--wrap=USBD_CDC_ClearBuffer      ; USB CDC drops RX when its queue fills; see platform.cpp
    -O2
    -Wall
extra_scripts =
    ${env.extra_scripts}
    pre:scripts/stm32_core_workarounds.py ; says when the USB CDC workaround below can go
    post:scripts/stm32_dfu_reboot.py     ; upload: CLI-reboot into the ROM DFU bootloader first
lib_deps =
    ${display_libs.lib_deps}
    ${sensor_libs.lib_deps}
    ${eeprom_libs.lib_deps}
    ${cli_libs.lib_deps}
    stm32duino/STM32duino STM32SD@^1.5.0 ; microSD on SDIO (the Arduino SD library is SPI only)
    https://github.com/stm32duino/FatFs.git#4.0.4   ; STM32SD 1.5 needs FatFs 4.x (the registry stops at 2.0.3)
; The Arduino SD library is SPI-only and defines the same SD/File names.
lib_ignore = SD

; Empty wiring default so ${feather_f405.wiring} resolves cleanly with no overlay.
; wiring.ini (gitignored) overrides this key with -D pin flags.
[feather_f405]
wiring =
; ADC sample time per conversion, at ADCCLK = 21 MHz. The core's default (15
; cycles, 0.7 us) is too short to settle a sender behind the v1 18k divider
; without its filter cap; 144 cycles is 6.9 us. Override this key in wiring.ini
; for the breadboard plan's short-vs-long check (ADC_SAMPLETIME_3CYCLES..480CYCLES).
adc_sampling = -D ADC_SAMPLINGTIME=ADC_SAMPLETIME_144CYCLES
