; boards/teensy36/board.ini — PlatformIO env fragment for Teensy 3.6.
; Merged via `extra_configs = boards/*/board.ini`. Pairs with board.h + wiring.ini.

[env:teensy36]
platform = teensy
board = teensy36
build_flags =
    -include boards/teensy36/board.h     ; board definition (facts) — must precede resolve.h
    -include boards/resolve.h            ; derives INCLUDE_* from SUPPORTS_* + wiring
    ${teensy36.wiring}                   ; your wiring (gitignored wiring.ini overrides the default below)
    -D TEENSY_36
    -D USE_FLEXCAN_NATIVE
    -O2
    -Wall
lib_deps =
    ${display_libs.lib_deps}
    ${sensor_libs.lib_deps}
    ${eeprom_libs.lib_deps}
    ${cli_libs.lib_deps}
    https://github.com/tonton81/FlexCAN_T4.git

; Empty wiring default so ${teensy36.wiring} resolves cleanly with no overlay.
[teensy36]
wiring =
