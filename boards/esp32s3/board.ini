; boards/esp32s3/board.ini — PlatformIO env fragment for ESP32-S3 (BLE only).
; Merged via `extra_configs = boards/*/board.ini`. Pairs with board.h + wiring.ini.

[env:esp32s3dev]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags =
    -include boards/esp32s3/board.h      ; board definition (facts) — must precede resolve.h
    -include boards/resolve.h            ; derives INCLUDE_* from SUPPORTS_* + wiring
    ${esp32s3dev.wiring}                 ; your wiring (gitignored wiring.ini overrides the default below)
    -D ESP32
    -D CONFIG_IDF_TARGET_ESP32S3         ; Explicitly set for chip detection
    -O2
    -Wall
lib_deps =
    ${display_libs.lib_deps}
    ${sensor_libs.lib_deps}
    ${eeprom_libs.lib_deps}
    ${cli_libs.lib_deps}
    https://github.com/handmade0octopus/ESP32-TWAI-CAN.git
    https://github.com/avinabmalla/ESP32_BleSerial.git#v1.0.4

; Empty wiring default so ${esp32s3dev.wiring} resolves cleanly with no overlay.
[esp32s3dev]
wiring =
