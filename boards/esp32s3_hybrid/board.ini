; boards/esp32s3_hybrid/board.ini — env fragment for ESP32-S3 hybrid CAN.
[env:esp32s3_hybrid]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_flags =
    -include boards/esp32s3_hybrid/board.h
    -include boards/resolve.h
    ${esp32s3_hybrid.wiring}
    -D ESP32_S3
    -O2
    -Wall
lib_deps =
    ${display_libs.lib_deps}
    ${sensor_libs.lib_deps}
    ${eeprom_libs.lib_deps}
    ${cli_libs.lib_deps}
    https://github.com/handmade0octopus/ESP32-TWAI-CAN.git
    https://github.com/avinabmalla/ESP32_BleSerial.git#v1.0.4
    autowp/autowp-mcp2515@^1.0.3

[esp32s3_hybrid]
wiring =
