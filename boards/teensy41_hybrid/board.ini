; boards/teensy41_hybrid/board.ini — env fragment for Teensy 4.1 hybrid CAN.
[env:teensy41_hybrid]
platform = teensy
board = teensy41
framework = arduino
build_flags =
    -include boards/teensy41_hybrid/board.h
    -include boards/resolve.h
    ${teensy41_hybrid.wiring}
    -D TEENSY_41
    -D USE_FLEXCAN_NATIVE
    -O2
    -Wall
lib_deps =
    ${display_libs.lib_deps}
    ${sensor_libs.lib_deps}
    ${eeprom_libs.lib_deps}
    ${cli_libs.lib_deps}
    https://github.com/tonton81/FlexCAN_T4.git
    autowp/autowp-mcp2515@^1.0.3

[teensy41_hybrid]
wiring =
