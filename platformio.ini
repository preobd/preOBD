; PlatformIO Project Configuration File
; Build configurations for different hardware platforms
;
; Feature flags and sizing constants are owned by per-board headers under
; boards/<board>/board.h. Each env injects its board.h (then boards/resolve.h)
; via -include — see boards/README.md. Hardware-derived constants (ADC
; resolution, voltage divider) stay in src/lib/platform.h.
; Framework ring-buffer sizes (SERIAL_TX_BUFFER_SIZE etc.) must be real -D flags
; here because framework core TUs are not reached by -include.

[platformio]
default_envs = teensy41
; Each migrated board owns a folder under boards/<board>/ with its env fragment
; (board.ini), its definition (board.h), and a gitignored wiring overlay
; (wiring.ini; see wiring.ini.example). These are merged in via the globs below.
extra_configs =
    boards/*/board.ini
    boards/*/wiring.ini

; ============================================================================
; SHARED CONFIGURATIONS
; ============================================================================

[env]
framework = arduino
monitor_speed = 115200
monitor_echo = no
monitor_raw = yes
lib_extra_dirs = lib
; Exclude sensor subdirectories from individual compilation
; They are included via sensor_read.cpp
build_src_filter = +<*> -<inputs/sensors/>
; Version injection + profile/lib consistency check
extra_scripts =
    pre:scripts/version_inject.py
    pre:scripts/verify_profile_libs.py

; ============================================================================
; LIBRARY DEPENDENCY GROUPS
; ============================================================================

; Display libraries
[display_libs]
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4

; CAN libraries (MCP2515 via SPI - supports multiple instances)
[can_libs]
lib_deps =
    autowp/autowp-mcp2515@^1.0.3

; Sensor libraries
[sensor_libs]
lib_deps =
    adafruit/Adafruit BME280 Library@^2.2.2

; EEPROM/JSON configuration 
[eeprom_libs]
lib_deps =
    bblanchon/ArduinoJson@^7.2.1

; CLI library (embedded-cli for command-line interface)
[cli_libs]
lib_deps =
    https://github.com/funbiscuit/embedded-cli.git

; ============================================================================
; TEENSY 4.1 (RECOMMENDED PLATFORM) — env in boards/teensy41/board.ini
; ============================================================================
; Migrated to the boards/ layout (#283): env fragment + board.h + wiring overlay
; all live in boards/teensy41/, merged via extra_configs.

; ============================================================================
; TEENSY 4.0 — env in boards/teensy40/board.ini
; ============================================================================
; Migrated to the boards/ layout (#283). nRF software flow-control pins
; (HOST_NRF_CTS/RTS_PIN) are now part of boards/teensy40/wiring.ini, like any
; other wiring — see wiring.ini.example.

; TEENSY 3.6 — env in boards/teensy36/board.ini (migrated, #283)
; ESP32-S3 (BLE only) — env in boards/esp32s3/board.ini (migrated, #283)

; ============================================================================
; ARDUINO MEGA 2560 — env in boards/mega2560/board.ini
; ============================================================================
; Migrated to the boards/ layout (#283). CEILING vetoes (PLATFORM_NO_SD_LOGGING,
; SUPPORTS_JSON_CONFIG=0) live in board.h; the core-TU SERIAL_*_BUFFER_SIZE -D
; flags stay in board.ini (build_flags).

; ============================================================================
; DEBUG ENVIRONMENT — env in boards/teensy41/board.ini
; ============================================================================
; Teensy 4.1 debug build (-Og -g -Wextra -D DEBUG); shares boards/teensy41/
; board.h + resolve.h + wiring with [env:teensy41].

; ============================================================================
; HYBRID CONTROLLER ENVIRONMENTS
; These environments enable mixing different CAN controller types on different buses
; Example: ESP32 TWAI (native, bus 0) + MCP2515 (SPI, bus 1) for dual-bus operation
; ============================================================================

; Migrated to the boards/ layout (#283): envs in
;   boards/esp32s3_hybrid/board.ini  and  boards/teensy41_hybrid/board.ini

; ============================================================================
; NATIVE TEST ENV — host unit tests (`pio test -e native`)
; ============================================================================
; Host-side unit tests for pure logic (frame codec, alarm state machine,
; broadcaster encoders, config CRC, registry hashing). Compiles with the host
; toolchain against the stub layer in test/stubs/ — never touches hardware and
; ships ZERO bytes to any board. Empty framework/extra_scripts/lib_extra_dirs
; override the arduino-oriented [env] defaults this env would otherwise inherit.
[env:native]
platform = native
test_framework = unity
test_build_src = no
framework =
lib_extra_dirs =
; ArduinoJson is header-only and host-clean — used by test_control_json to
; round-trip the control-engine Rule/Action JSON converters (src/lib/control_json.cpp).
lib_deps =
    bblanchon/ArduinoJson@^7.2.1
extra_scripts =
build_flags =
    -std=gnu++17
    -D NATIVE_TEST
    -I test/stubs
    -include test/stubs/profile_native.h
    ; Dead-strip unreferenced functions so a test can #include a firmware .cpp
    ; without satisfying the heavy deps of its *unused* free functions (e.g.
    ; ELM327's initELM327 pulls msg/systemConfig that the parser path doesn't).
    ; macOS ld64 syntax — this is the local dev/test platform (no Linux CI).
    -Wl,-dead_strip
