; PlatformIO Project Configuration File
; Build configurations for different hardware platforms
;
; Feature flags and sizing constants are owned by per-env profile headers under
; src/profiles/. Each env injects its profile via -include. Hardware-derived
; constants (ADC resolution, voltage divider) stay in src/lib/platform.h.
; Framework ring-buffer sizes (SERIAL_TX_BUFFER_SIZE etc.) must be real -D flags
; here because framework core TUs are not reached by -include.

[platformio]
default_envs = teensy41
; Bench-specific overrides (flow-control GPIO pin assignments, etc.) live in
; a gitignored `platformio_local.ini` and are merged in here when present.
; See `platformio_local.ini.example` for the template. Without that file,
; the [bench_local] defaults below are picked up and resolve to empty.
extra_configs = platformio_local.ini

; ============================================================================
; BENCH-LOCAL OVERRIDES (defaults — overridden by platformio_local.ini)
; ============================================================================

; Empty defaults so ${bench_local.*} interpolation resolves cleanly even when
; no platformio_local.ini is present. Override either of these by defining
; a `[bench_local]` section in platformio_local.ini.
[bench_local]
; Software flow control wired between Teensy and nRF52840 coprocessor. Used
; by the teensy40 / teensy41 envs. Define both pins or neither — the host
; side compiles to a no-op when either is undefined.
host_flow_control =

; ============================================================================
; SHARED CONFIGURATIONS
; ============================================================================

[env]
framework = arduino
monitor_speed = 115200
monitor_echo = no
monitor_raw = yes
lib_extra_dirs = lib
; Exclude sensor subdirectories from individual compilation
; They are included via sensor_read.cpp
build_src_filter = +<*> -<inputs/sensors/>
; Version injection + profile/lib consistency check
extra_scripts =
    pre:scripts/version_inject.py
    pre:scripts/verify_profile_libs.py

; ============================================================================
; LIBRARY DEPENDENCY GROUPS
; ============================================================================

; Display libraries
[display_libs]
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4

; CAN libraries (MCP2515 via SPI - supports multiple instances)
[can_libs]
lib_deps =
    autowp/autowp-mcp2515@^1.0.3

; Sensor libraries
[sensor_libs]
lib_deps =
    adafruit/Adafruit BME280 Library@^2.2.2

; EEPROM/JSON configuration 
[eeprom_libs]
lib_deps =
    bblanchon/ArduinoJson@^7.2.1

; CLI library (embedded-cli for command-line interface)
[cli_libs]
lib_deps =
    https://github.com/funbiscuit/embedded-cli.git

; ============================================================================
; TEENSY 4.1 (RECOMMENDED PLATFORM)
; Profile: src/profiles/profile_teensy41.h
; ============================================================================

[env:teensy41]
platform = teensy
board = teensy41
upload_protocol = teensy-cli
build_flags =
    -include src/profiles/profile_teensy41.h
    -D TEENSY_41
    -D USE_FLEXCAN_NATIVE
    -O2
    -Wall
lib_deps =
    ${display_libs.lib_deps}
    ${sensor_libs.lib_deps}
    ${eeprom_libs.lib_deps}
    ${cli_libs.lib_deps}
    https://github.com/tonton81/FlexCAN_T4.git
    https://github.com/tonton81/WDT_T4.git

; ============================================================================
; TEENSY 4.0
; Profile: src/profiles/profile_teensy40.h
; ============================================================================

[env:teensy40]
platform = teensy
board = teensy40
upload_protocol = teensy-cli
build_flags =
    -include src/profiles/profile_teensy40.h
    -D TEENSY_40
    -D USE_FLEXCAN_NATIVE
    -O2
    -Wall
    ; Phase 3 -- nRF52840 coprocessor link software-paced flow control.
    ; Teensy 4.x Serial1 has no hardware CTS pin, so we GPIO-pace instead:
    ;   HOST_NRF_CTS_PIN: Teensy reads (input) -- nRF drives HIGH to pause us
    ;   HOST_NRF_RTS_PIN: Teensy drives (output) -- LOW = always-ready (Phase 3)
    ; Pin assignments are bench-specific; set both in platformio_local.ini
    ; (gitignored) -- see platformio_local.ini.example for the template.
    ; (Future STM32 production port will reuse these macros to configure
    ; real LPUART HW flow control via HAL_UART_Init.)
    ${bench_local.host_flow_control}
lib_deps =
    ${display_libs.lib_deps}
    ${sensor_libs.lib_deps}
    ${eeprom_libs.lib_deps}
    ${cli_libs.lib_deps}
    https://github.com/tonton81/FlexCAN_T4.git
    https://github.com/tonton81/WDT_T4.git

; ============================================================================
; TEENSY 3.6
; Profile: src/profiles/profile_teensy36.h
; ============================================================================

[env:teensy36]
platform = teensy
board = teensy36
build_flags =
    -include src/profiles/profile_teensy36.h
    -D TEENSY_36
    -D USE_FLEXCAN_NATIVE
    -O2
    -Wall
lib_deps =
    ${display_libs.lib_deps}
    ${sensor_libs.lib_deps}
    ${eeprom_libs.lib_deps}
    ${cli_libs.lib_deps}
    https://github.com/tonton81/FlexCAN_T4.git

; ============================================================================
; ESP32-S3 (BLE Only - No Bluetooth Classic)
; Profile: src/profiles/profile_esp32s3.h
; ============================================================================

[env:esp32s3dev]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags =
    -include src/profiles/profile_esp32s3.h
    -D ESP32
    -D CONFIG_IDF_TARGET_ESP32S3       ; Explicitly set for chip detection
    -O2
    -Wall
lib_deps =
    ${display_libs.lib_deps}
    ${sensor_libs.lib_deps}
    ${eeprom_libs.lib_deps}
    ${cli_libs.lib_deps}
    https://github.com/handmade0octopus/ESP32-TWAI-CAN.git
    avinabmalla/ESP32_BleSerial@^1.0.4

; ============================================================================
; ARDUINO MEGA 2560
; Profile: src/profiles/profile_mega2560.h
; ============================================================================

[env:mega2560]
platform = atmelavr
board = megaatmega2560
build_flags =
    -include src/profiles/profile_mega2560.h
    -D ARDUINO_MEGA
    ; Framework ring-buffer tuning — must be real -D flags (not in profile) because
    ; -include does not reach core TUs (HardwareSerial).
    ; 4 UARTs × (64→16 TX + 64→32 RX) saves ~192 B.
    ; Note: -D BUFFER_LENGTH for Wire is ineffective — AVR Wire.h hard-codes it
    ; without an #ifndef guard, so the flag produces a redefinition warning and
    ; the library default (32 B) wins.
    -D SERIAL_TX_BUFFER_SIZE=16
    -D SERIAL_RX_BUFFER_SIZE=32
    -O2
    -Wall
lib_deps =
    ${display_libs.lib_deps}
    ${can_libs.lib_deps}
    ${sensor_libs.lib_deps}
    ${cli_libs.lib_deps}

; ============================================================================
; DEBUG ENVIRONMENT
; Same feature set as teensy41; compiler flags differ (-Og -g -Wextra -D DEBUG).
; Profile: src/profiles/profile_teensy41.h
; ============================================================================

[env:debug]
platform = teensy
board = teensy41
build_flags =
    -include src/profiles/profile_teensy41.h
    -D TEENSY_41
    -D USE_FLEXCAN_NATIVE
    -D DEBUG
    -Og
    -g
    -Wall
    -Wextra
build_type = debug
lib_deps =
    ${display_libs.lib_deps}
    ${sensor_libs.lib_deps}
    ${eeprom_libs.lib_deps}
    ${cli_libs.lib_deps}
    https://github.com/tonton81/FlexCAN_T4.git
    https://github.com/tonton81/WDT_T4.git
; Note: monitor_raw=yes inherited from [env], so monitor_filters removed to avoid conflict

; ============================================================================
; HYBRID CONTROLLER ENVIRONMENTS
; These environments enable mixing different CAN controller types on different buses
; Example: ESP32 TWAI (native, bus 0) + MCP2515 (SPI, bus 1) for dual-bus operation
; ============================================================================

; Profile: src/profiles/profile_esp32s3_hybrid.h
[env:esp32s3_hybrid]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
build_flags =
    -include src/profiles/profile_esp32s3_hybrid.h
    -D ESP32_S3
    -O2
    -Wall
lib_deps =
    ${display_libs.lib_deps}
    ${sensor_libs.lib_deps}
    ${eeprom_libs.lib_deps}
    ${cli_libs.lib_deps}
    https://github.com/handmade0octopus/ESP32-TWAI-CAN.git
    avinabmalla/ESP32_BleSerial@^1.0.4
    autowp/autowp-mcp2515@^1.0.3

; Profile: src/profiles/profile_teensy41_hybrid.h
[env:teensy41_hybrid]
platform = teensy
board = teensy41
framework = arduino
build_flags =
    -include src/profiles/profile_teensy41_hybrid.h
    -D TEENSY_41
    -D USE_FLEXCAN_NATIVE
    -O2
    -Wall
lib_deps =
    ${display_libs.lib_deps}
    ${sensor_libs.lib_deps}
    ${eeprom_libs.lib_deps}
    ${cli_libs.lib_deps}
    https://github.com/tonton81/FlexCAN_T4.git
    https://github.com/tonton81/WDT_T4.git
    autowp/autowp-mcp2515@^1.0.3

; ============================================================================
; NATIVE TEST ENV — host unit tests (`pio test -e native`)
; ============================================================================
; Host-side unit tests for pure logic (frame codec, alarm state machine,
; broadcaster encoders, config CRC, registry hashing). Compiles with the host
; toolchain against the stub layer in test/stubs/ — never touches hardware and
; ships ZERO bytes to any board. Empty framework/extra_scripts/lib_extra_dirs
; override the arduino-oriented [env] defaults this env would otherwise inherit.
[env:native]
platform = native
test_framework = unity
test_build_src = no
framework =
lib_extra_dirs =
extra_scripts =
build_flags =
    -std=gnu++17
    -D NATIVE_TEST
    -I test/stubs
    -include test/stubs/profile_native.h
    ; Dead-strip unreferenced functions so a test can #include a firmware .cpp
    ; without satisfying the heavy deps of its *unused* free functions (e.g.
    ; ELM327's initELM327 pulls msg/systemConfig that the parser path doesn't).
    ; macOS ld64 syntax — this is the local dev/test platform (no Linux CI).
    -Wl,-dead_strip
