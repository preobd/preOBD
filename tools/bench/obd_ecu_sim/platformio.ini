; OBD-II ECU simulator for bench-testing preOBD's CAN input polling (#476).
; Standalone project — never part of the firmware image.
;
;   cd tools/bench/obd_ecu_sim
;   pio run -t upload          # Mega 2560 + MCP2515 shield
;   pio device monitor         # 115200 baud; type 'h' for commands
;
; Match the shield: MCP_CS_PIN (10 on most current shields, 9 on older
; Seeed v1.x) and MCP_CRYSTAL_MHZ (read the can on the crystal: 8 or 16).

[env:mega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
lib_deps =
    autowp/autowp-mcp2515@^1.0.3
build_flags =
    -D MCP_CS_PIN=9
    -D MCP_CRYSTAL_MHZ=16
    -D CAN_BITRATE_KBPS=500
