    </div>
  </div>

  <!-- Terminal -->
  <div class="panel" id="terminal">
    <div class="panel-header" style="cursor:pointer" id="terminalHeader">
      <span class="panel-title">Terminal</span>
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-family:var(--mono);font-size:10px;color:var(--dim-light);letter-spacing:0.04em">BLE</span>
        <button class="panel-collapse-btn" id="btnTerminalToggle" title="Collapse terminal">▲</button>
      </div>
    </div>
    <div class="panel-body">
      <div id="output"><span class="info">Connect to a preOBD device to begin.</span>
</div>
      <div class="quick-actions" id="quickActions">
        <button class="btn" data-cmd="VERSION" disabled>VERSION</button>
        <button class="btn" data-cmd="LIST INPUTS" disabled>LIST INPUTS</button>
        <button class="btn" data-cmd="LIST OUTPUTS" disabled>LIST OUTPUTS</button>
        <button class="btn" data-cmd="RELAY LIST" disabled>RELAY LIST</button>
        <button class="btn" data-cmd="CONFIG" disabled>CONFIG</button>
        <button class="btn" data-cmd="RUN" disabled>RUN</button>
        <button class="btn" data-cmd="HELP" disabled>HELP</button>
      </div>
      <div class="input-row">
        <input type="text" id="cmdInput" placeholder="Type a command…" disabled autocomplete="off" spellcheck="false">
        <button class="btn primary" id="btnSend" disabled>Send</button>
      </div>
    </div>
  </div>

  <footer class="app-footer">
    <span id="webappBuild">build: --</span>
  </footer>

</main>

<script>
// Build identity for the footer. WEBAPP_VERSION is the deploy stamp:
// tools/inject_webapp_version.py rewrites it in CI (right before the Pages
// upload) to a webapp-scoped git id like "b237 @abc1234". The committed repo
// value stays the 'dev' sentinel, so a local working copy is always visually
// distinct from a real deploy. In the dev case we fall back to
// document.lastModified, which ticks on every save and doubles as a
// "did my latest edit actually load?" signal.
const WEBAPP_VERSION = 'dev';
(function stampBuildFooter() {
  const el = document.getElementById('webappBuild');
  if (!el) return;
  if (WEBAPP_VERSION && WEBAPP_VERSION !== 'dev') {
    el.textContent = 'build: ' + WEBAPP_VERSION;
    el.title = 'Deployed build — webapp-scoped git commit identity';
    return;
  }
  const lm = document.lastModified || '';
  el.innerHTML = '<span class="dev-tag">DEV</span>local · ' + (lm || 'uncommitted');
  el.title = 'Local working copy (not a CI deploy). Timestamp is the file ' +
             'last-modified time, which updates on every save.';
})();

// preOBD BLE GATT UUIDs (from ble_gatt_defs.h)
const PREOBD_SERVICE     = '4f424400-7072-654f-4244-000000000001';
const PREOBD_CMD_TX      = '4f424400-7072-654f-4244-000000000010';
const PREOBD_CMD_RX      = '4f424400-7072-654f-4244-000000000011';
const PREOBD_STATUS      = '4f424400-7072-654f-4244-000000000020';
const PREOBD_EXT_SERVICE = '4f424400-7072-654f-4244-000000000002';
const PREOBD_CHAR_ALARM  = '4f424400-7072-654f-4244-000000000030';
const PREOBD_CHAR_RELAY  = '4f424400-7072-654f-4244-000000000031';
const NUS_SERVICE        = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const NUS_RX             = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
const NUS_TX             = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';
// HM-10 / CC2541 BLE modules use a single characteristic for RX and TX
const HM10_SERVICE       = '0000ffe0-0000-1000-8000-00805f9b34fb';
const HM10_CHAR          = '0000ffe1-0000-1000-8000-00805f9b34fb';
const DIS_SERVICE        = 0x180A;

// Severity / kind constants mirror ble_gatt_defs.h
const SEV_NORMAL = 0, SEV_WARNING = 1, SEV_ALARM = 2;
const KIND_CLEAR = 0, KIND_HIGH = 1, KIND_LOW = 2;
const RELAY_MODE_DISABLED = 0, RELAY_MODE_AUTO_HIGH = 1, RELAY_MODE_AUTO_LOW = 2;
const RELAY_MODE_MANUAL_ON = 3, RELAY_MODE_MANUAL_OFF = 4;

const PROMPT = 'preOBD> ';
const ENCODER = new TextEncoder();
const DECODER = new TextDecoder();

// State
let device = null;
let server = null;
let mode = null;       // 'preobd', 'nus', or 'hm10'
let txChar = null;     // characteristic to write commands to
let rxChar = null;     // characteristic that notifies responses
let statusChar = null; // system status characteristic (preobd mode only)
let alarmChar = null;  // alarm notify characteristic (enhanced mode only)
let relayChar = null;  // relay control read/write/notify (enhanced mode only)
let framedMode = false; // true when Extended Service is present
let lastStatusNotifyMs = 0; // ms timestamp of most recent Status notify; 0 = none
const LIVE_FRESHNESS_MS = 15000; // status notify within this window → Live badge
let cmdHistory = [];
let historyIdx = -1;

// Alarm + relay UI state (populated by notifications)
const alarmLog = [];           // newest-first, capped at MAX_ALARM_LOG
const MAX_ALARM_LOG = 50;
const firingState = new Map(); // inputIndex -> { severity, kind, value, threshold, since }
const relayState  = new Map(); // relayIndex -> last-seen PreobdRelayState fields
const relayEditDirty = new Set(); // relayIndex set of rows with unsaved edits

// Command queue
let cmdQueue = [];
let cmdPending = false;
let pendingResolve = null;
let pendingReject = null;
let suppressOutput = false;

// Config UI state
let originalConfig = null;
let localConfig = null;
let catalog = { applications: [], sensors: [], units: [] };
let inputState = new Map();
let editingPin = null;  // null = add mode, string pin = edit mode

// DOM refs
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const btnConnect = document.getElementById('btnConnect');
const btnDisconnect = document.getElementById('btnDisconnect');
const statusPanel = document.getElementById('statusPanel');
const output = document.getElementById('output');
const cmdInput = document.getElementById('cmdInput');
const btnSend = document.getElementById('btnSend');
const quickBtns = document.querySelectorAll('[data-cmd]');

// --- Connection ---

btnConnect.addEventListener('click', connect);
btnDisconnect.addEventListener('click', disconnect);
btnSend.addEventListener('click', sendCommand);
cmdInput.addEventListener('keydown', handleInputKey);
quickBtns.forEach(btn => btn.addEventListener('click', () => sendText(btn.dataset.cmd)));

async function connect() {
  if (!navigator.bluetooth) {
    appendInfo('Web Bluetooth is not supported in this browser. Use Chrome or Edge.');
    return;
  }
  output.innerHTML = '';
  try {
    appendInfo('Scanning for BLE devices...');
    // Show both preOBD and NUS devices in a single scan dialog.
    // After connecting, we detect which services are available.
    device = await navigator.bluetooth.requestDevice({
      filters: [
        { services: [PREOBD_SERVICE] },
        { services: [NUS_SERVICE] },
        { services: [HM10_SERVICE] }
      ],
      optionalServices: [PREOBD_SERVICE, PREOBD_EXT_SERVICE, NUS_SERVICE, HM10_SERVICE, DIS_SERVICE]
    });

    device.addEventListener('gattserverdisconnected', onDisconnected);
    appendInfo('Connecting to ' + device.name + '...');

    server = await device.gatt.connect();

    // Try preOBD service first
    try {
      const svc = await server.getPrimaryService(PREOBD_SERVICE);
      txChar = await svc.getCharacteristic(PREOBD_CMD_TX);
      rxChar = await svc.getCharacteristic(PREOBD_CMD_RX);
      try { statusChar = await svc.getCharacteristic(PREOBD_STATUS); } catch(e) { statusChar = null; }
      mode = 'preobd';

      // Extended Service (framed mode only). Optional — its absence is
      // expected on HM-10, stock Bluefruit, and framed-disabled nRF setups.
      try {
        const ext = await server.getPrimaryService(PREOBD_EXT_SERVICE);
        try { alarmChar = await ext.getCharacteristic(PREOBD_CHAR_ALARM); } catch(e) { alarmChar = null; }
        try { relayChar = await ext.getCharacteristic(PREOBD_CHAR_RELAY); } catch(e) { relayChar = null; }
        framedMode = !!(alarmChar || relayChar);
      } catch(e) {
        framedMode = false;
      }

      appendInfo(framedMode ? 'Connected (preOBD, enhanced features available)'
                            : 'Connected (preOBD, basic mode)');
    } catch (e) {
      // Fall back to NUS
      try {
        const svc = await server.getPrimaryService(NUS_SERVICE);
        txChar = await svc.getCharacteristic(NUS_RX);  // NUS RX = we write to it
        rxChar = await svc.getCharacteristic(NUS_TX);   // NUS TX = we read from it
        statusChar = null;
        mode = 'nus';
        appendInfo('Connected (NUS terminal mode)');
      } catch (e2) {
        // Fall back to HM-10 (single characteristic for both RX and TX)
        const svc = await server.getPrimaryService(HM10_SERVICE);
        const char = await svc.getCharacteristic(HM10_CHAR);
        txChar = char;
        rxChar = char;
        statusChar = null;
        mode = 'hm10';
        appendInfo('Connected (HM-10 terminal mode)');
      }
    }

    // Subscribe to notifications
    await rxChar.startNotifications();
    rxChar.addEventListener('characteristicvaluechanged', onRxData);

    setConnected(true);
    updateFramedBadge();

    // Read the standard Device Information Service (0x180A) if exposed.
    // The nRF firmware registers this so clients can verify which build
    // is flashed; absence is fine (HM-10 / older nRF firmware don't have it).
    try {
      const dis = await server.getPrimaryService(DIS_SERVICE);
      const fwChar = await dis.getCharacteristic(0x2A26); // Firmware Revision
      const val = await fwChar.readValue();
      document.getElementById('valNrfFw').textContent = 'nRF ' + (DECODER.decode(val) || '--');
    } catch (e) {
      document.getElementById('valNrfFw').textContent = 'nRF --';
    }

    // Read system status if available; subscribe to push updates in framed mode.
    if (statusChar) {
      try {
        const initial = await statusChar.readValue();
        applySystemStatus(initial);
      } catch(e) { /* fall back to notify-driven population */ }
      if (framedMode) {
        try {
          await statusChar.startNotifications();
          statusChar.addEventListener('characteristicvaluechanged', onStatusNotify);
        } catch(e) { appendErr('Failed to subscribe to Status notifications: ' + e.message); }
      }
    } else {
      statusPanel.classList.add('hidden');
    }

    // Subscribe to Alarm + Relay notifications + seed the relay panel.
    if (alarmChar) {
      try {
        await alarmChar.startNotifications();
        alarmChar.addEventListener('characteristicvaluechanged', onAlarmNotify);
      } catch(e) { appendErr('Failed to subscribe to Alarm notifications: ' + e.message); }
    }
    if (relayChar) {
      try {
        await relayChar.startNotifications();
        relayChar.addEventListener('characteristicvaluechanged', onRelayNotify);
        // Initial read so the panel populates before any state changes.
        try {
          const r = await relayChar.readValue();
          applyRelayState(r);
        } catch(e) { /* notify will populate eventually */ }
      } catch(e) { appendErr('Failed to subscribe to Relay notifications: ' + e.message); }
    }
    renderAlarmPanel();
    renderRelayPanel();

    fetchInitialState();

  } catch (err) {
    if (err.name !== 'NotFoundError') {  // User cancelled scan
      appendErr('Connection failed: ' + err.message);
    }
  }
}

function disconnect() {
  if (device && device.gatt.connected) {
    device.gatt.disconnect();
  }
}

function onDisconnected() {
  setConnected(false);
  appendInfo('Disconnected.');
  txChar = null;
  rxChar = null;
  statusChar = null;
  alarmChar = null;
  relayChar = null;
  framedMode = false;
  lastStatusNotifyMs = 0;
  document.getElementById('valNrfFw').textContent = 'nRF --';
  updateFramedBadge();
  alarmLog.length = 0;
  firingState.clear();
  relayState.clear();
  relayEditDirty.clear();
  renderAlarmPanel();
  renderRelayPanel();
  mode = null;
  // Reject any in-flight or queued commands so awaiting frames throw
  if (pendingReject) {
    const rej = pendingReject;
    pendingResolve = null;
    pendingReject = null;
    rej(new Error('Disconnected'));
  }
  for (const { reject } of cmdQueue) reject(new Error('Disconnected'));
  cmdQueue = [];
  cmdPending = false;
  suppressOutput = false;
  // Reset config UI
  originalConfig = null;
  localConfig = null;
  inputState.clear();
  document.getElementById('inputsPanel').style.display = 'none';
}

function setConnected(connected) {
  statusDot.classList.toggle('connected', connected);
  statusText.textContent = connected ? (device.name || 'Connected') : 'Disconnected';
  statusText.classList.toggle('connected', connected);
  btnConnect.classList.toggle('hidden', connected);
  btnDisconnect.classList.toggle('hidden', !connected);
  cmdInput.disabled = !connected;
  btnSend.disabled = !connected;
  quickBtns.forEach(btn => btn.disabled = !connected);
}

// --- Data Handling ---

let rxBuffer = '';

function onRxData(event) {
  const chunk = DECODER.decode(event.target.value);
  rxBuffer += chunk;

  const promptIdx = rxBuffer.indexOf(PROMPT);
  if (promptIdx !== -1) {
    const response = rxBuffer.substring(0, promptIdx);
    rxBuffer = rxBuffer.substring(promptIdx + PROMPT.length);
    if (response.trim() && !suppressOutput) {
      appendOutput(response);
    }
    if (pendingResolve) {
      const res = pendingResolve;
      pendingResolve = null;
      pendingReject = null;
      cmdPending = false;
      res(response);
    } else {
      cmdPending = false;
    }
    drainQueue();
  }
}

async function sendText(cmd) {
  if (!txChar) return;
  const text = cmd + '\n';
  appendCmd(cmd);

  // Split into chunks if needed (BLE write limit)
  const data = ENCODER.encode(text);
  const chunkSize = 200;  // Conservative; most MTUs allow 247+
  for (let i = 0; i < data.length; i += chunkSize) {
    const chunk = data.slice(i, i + chunkSize);
    try {
      await txChar.writeValueWithoutResponse(chunk);
    } catch (e) {
      try {
        await txChar.writeValue(chunk);
      } catch (e2) {
        appendErr('Write failed: ' + e2.message);
        return;
      }
    }
  }
}

function sendCommand() {
  const cmd = cmdInput.value.trim();
  if (!cmd) return;
  cmdHistory.unshift(cmd);
  if (cmdHistory.length > 50) cmdHistory.pop();
  historyIdx = -1;
  cmdInput.value = '';
  sendText(cmd);
}

function handleInputKey(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    sendCommand();
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (historyIdx < cmdHistory.length - 1) {
      historyIdx++;
      cmdInput.value = cmdHistory[historyIdx];
    }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (historyIdx > 0) {
      historyIdx--;
      cmdInput.value = cmdHistory[historyIdx];
    } else {
      historyIdx = -1;
      cmdInput.value = '';
    }
  }
}

// --- System Status ---

function applySystemStatus(val) {
  if (!val || val.byteLength < 32) return false;

  const magic = val.getUint32(0, true);
  if (magic !== 0x704F4244) return false;  // "pOBD"

  const sysMode = val.getUint8(5);
  const inputs = val.getUint8(6);
  const relays = val.getUint8(7);
  const uptime = val.getUint32(8, true);
  const major = val.getUint8(12);
  const minor = val.getUint8(13);
  const patch = val.getUint8(14);

  // Device name: bytes 16-31, null-terminated
  const nameBytes = new Uint8Array(val.buffer, val.byteOffset + 16, 16);
  const nullIdx = nameBytes.indexOf(0);
  const name = DECODER.decode(nameBytes.slice(0, nullIdx === -1 ? 16 : nullIdx));

  document.getElementById('valFirmware').textContent = major + '.' + minor + '.' + patch;
  document.getElementById('valMode').textContent = sysMode === 0 ? 'CONFIG' : 'RUN';
  document.getElementById('valMode').style.color = sysMode === 0 ? 'var(--yellow)' : 'var(--brand)';
  document.getElementById('valInputs').textContent = inputs;
  document.getElementById('valRelays').textContent = relays;
  document.getElementById('valUptime').textContent = formatUptime(uptime);
  document.getElementById('valDevice').textContent = name || '--';

  statusPanel.classList.remove('hidden');
  return true;
}

function onStatusNotify(event) {
  if (applySystemStatus(event.target.value)) {
    lastStatusNotifyMs = Date.now();
    updateFramedBadge();
  }
}

// --- Alarms ---

function onAlarmNotify(event) {
  const v = event.target.value;
  if (!v || v.byteLength < 18) return;

  const inputIndex = v.getUint8(1);
  const severity   = v.getUint8(2);
  const kind       = v.getUint8(3);
  const sequence   = v.getUint16(4, true);
  const value      = v.getFloat32(6, true);
  const threshold  = v.getFloat32(10, true);
  // timestampMs at offset 14 is device-side millis(); we use client-side
  // wall-clock for relative-time rendering so it stays correct after page
  // refresh / reconnect.
  const now = Date.now();

  // Maintain the firing-state cache. CLEAR transitions remove the entry.
  if (severity === SEV_NORMAL && kind === KIND_CLEAR) {
    firingState.delete(inputIndex);
  } else {
    const prior = firingState.get(inputIndex);
    firingState.set(inputIndex, {
      severity, kind, value, threshold,
      since: (prior && prior.severity === severity && prior.kind === kind)
                ? prior.since : now,
    });
  }

  // Push to the log (newest first).
  alarmLog.unshift({ inputIndex, severity, kind, value, threshold, sequence, at: now });
  if (alarmLog.length > MAX_ALARM_LOG) alarmLog.length = MAX_ALARM_LOG;

  renderAlarmPanel();
}

function inputLabel(idx) {
  // Cross-reference against the catalog if it's been fetched. Falls back to
  // a raw "#N" label so the UI still works during the first few seconds
  // after connect, before SYSTEM DUMP JSON completes.
  const inps = (localConfig && localConfig.inputs) || [];
  const inp = inps[idx];
  if (!inp) return '#' + idx;
  const abbr = (inp.abbr || inp.abbrName || '').trim();
  const name = (inp.name || inp.displayName || '').trim();
  if (abbr && name) return abbr + ' (' + name + ')';
  return abbr || name || '#' + idx;
}

function formatRelativeTime(ms) {
  const secs = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (secs < 5)    return 'now';
  if (secs < 60)   return secs + 's ago';
  if (secs < 3600) return Math.floor(secs / 60) + 'm ago';
  if (secs < 86400) {
    const h = Math.floor(secs / 3600);
    const m = Math.floor((secs % 3600) / 60);
    return h + 'h ' + (m ? m + 'm' : '') + ' ago';
  }
  return Math.floor(secs / 86400) + 'd ago';
}

function formatFiringDuration(ms) {
  const secs = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (secs < 60) return secs + 's';
  const m = Math.floor(secs / 60);
  const s = secs % 60;
  if (m < 60) return m + 'm ' + s + 's';
  const h = Math.floor(m / 60);
  return h + 'h ' + (m % 60) + 'm';
}

function severityTone(severity, kind) {
  if (kind === KIND_CLEAR) return 'ok';
  if (severity === SEV_ALARM)   return 'bad';
  if (severity === SEV_WARNING) return 'warn';
  return 'ok';
}

function alarmMessage(ev) {
  const label = inputLabel(ev.inputIndex);
  const val = Number.isFinite(ev.value) ? ev.value.toFixed(1) : '--';
  if (ev.kind === KIND_CLEAR) return label + ' · cleared (' + val + ')';
  const thr = Number.isFinite(ev.threshold) ? ev.threshold.toFixed(1) : '--';
  const verb = ev.severity === SEV_WARNING ? 'approaching' : 'exceeded';
  const dir  = ev.kind === KIND_LOW ? 'below' : '';
  return label + ' · ' + val + ' ' + (dir ? dir + ' ' : '') + verb + ' ' + thr;
}

// Health headline at the top of System Status — a single-glance summary of
// alarm state that mirrors the mobile overview banner. Only meaningful when
// the device exposes the alarm channel (framed mode); otherwise hidden.
function updateStatusHealth() {
  const el = document.getElementById('statusHealth');
  if (!el) return;
  if (!framedMode || !alarmChar) { el.style.display = 'none'; return; }
  el.style.display = '';

  const n = firingState.size;
  if (n === 0) {
    el.className = 'status-health ok';
    el.innerHTML = '<span class="health-dot"></span>' +
                   '<span class="health-text">All systems normal</span>';
    return;
  }

  // Lead with the first firing input; summarise the rest as "+N more".
  const [idx, st] = firingState.entries().next().value;
  const label = inputLabel(idx);
  const val = Number.isFinite(st.value) ? st.value.toFixed(1) : '--';
  const thr = Number.isFinite(st.threshold) ? st.threshold.toFixed(1) : '--';
  const verb = st.kind === KIND_LOW ? 'below' : 'exceeded';
  const more = n > 1 ? ' · +' + (n - 1) + ' more' : '';

  el.className = 'status-health firing';
  el.innerHTML =
    '<span class="health-dot"></span>' +
    '<div class="health-text">' +
      '<div class="health-title">' + n + ' alarm' + (n === 1 ? '' : 's') + ' firing</div>' +
      '<div class="health-meta">' + escHtml(label) + ' · ' + escHtml(val) + ' ' +
        verb + ' ' + escHtml(thr) + escHtml(more) + '</div>' +
    '</div>' +
    '<button class="health-review" id="healthReview">Review</button>';
  const btn = document.getElementById('healthReview');
  if (btn) btn.onclick = () =>
    document.getElementById('alarmPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function renderAlarmPanel() {
  const panel = document.getElementById('alarmPanel');
  if (!panel) return;
  updateStatusHealth();
  // The panel stays visible whenever the device exposes the enhanced
  // feature set, even if the alarm characteristic specifically failed to
  // subscribe or no events have arrived yet. The empty state reads better
  // than a vanishing panel and gives the user a hook to diagnose.
  if (!framedMode) {
    panel.style.display = 'none';
    return;
  }
  panel.style.display = '';

  const banner = document.getElementById('firingBanner');
  if (firingState.size === 0) {
    banner.style.display = 'none';
    banner.innerHTML = '';
  } else {
    banner.style.display = '';
    banner.className = 'firing-banner';
    let html = '';
    for (const [idx, st] of firingState) {
      const label = inputLabel(idx);
      const val = Number.isFinite(st.value) ? st.value.toFixed(1) : '--';
      const thr = Number.isFinite(st.threshold) ? st.threshold.toFixed(1) : '--';
      const verb = st.kind === KIND_LOW ? 'below' : 'exceeded';
      html += '<div class="firing-row"><span class="firing-dot"></span>' +
              '<div class="firing-text">' +
              escHtml(label) + ' · ' + escHtml(val) + ' ' + verb + ' ' + escHtml(thr) +
              '<span class="meta">Firing for ' + escHtml(formatFiringDuration(st.since)) + '</span>' +
              '</div></div>';
    }
    banner.innerHTML = html;
  }

  const log = document.getElementById('alarmLog');
  if (!alarmChar) {
    log.innerHTML = '<div class="alarm-log"><div class="empty-row">' +
                    'Alarm channel not available on this device.</div></div>';
    return;
  }
  if (alarmLog.length === 0) {
    log.innerHTML = '<div class="alarm-log"><div class="empty-row">No alarm events yet.</div></div>';
    return;
  }
  let html = '<div class="alarm-log">';
  for (const ev of alarmLog) {
    const tone = severityTone(ev.severity, ev.kind);
    html += '<div class="alarm-row tone-' + tone + '">' +
            '<span class="tone-dot"></span>' +
            '<div class="msg">' + escHtml(alarmMessage(ev)) + '</div>' +
            '<div class="ts">' + escHtml(formatRelativeTime(ev.at)) + '</div>' +
            '</div>';
  }
  html += '</div>';
  log.innerHTML = html;
}

// Periodically re-render so relative timestamps + firing durations tick.
setInterval(() => {
  if (alarmChar && (alarmLog.length || firingState.size)) renderAlarmPanel();
}, 1000);

// --- Relays ---

function applyRelayState(val) {
  if (!val || val.byteLength < 16) return;
  const relayIndex   = val.getUint8(1);
  const mode         = val.getUint8(2);
  const state        = val.getUint8(3);
  const inputIndex   = val.getUint8(4);
  const outputPin    = val.getUint8(5);
  const sequence     = val.getUint16(6, true);
  const thresholdOn  = val.getFloat32(8, true);
  const thresholdOff = val.getFloat32(12, true);

  // Skip unconfigured/disabled slots. The broadcaster walks all MAX_RELAYS
  // positions so we filter here rather than there. `outputPin === 0xFF` is
  // the EEPROM "unassigned" sentinel; on fresh boards it may instead be 0,
  // so we also hide rows whose mode is DISABLED — those are no-ops on the
  // host's relay loop either way.
  const unconfigured = (outputPin === 0xFF) || (mode === RELAY_MODE_DISABLED);
  if (unconfigured) {
    relayState.delete(relayIndex);
  } else {
    relayState.set(relayIndex, { mode, state, inputIndex, outputPin, thresholdOn, thresholdOff });
  }
  renderRelayPanel();
}

function onRelayNotify(event) {
  applyRelayState(event.target.value);
}

function modeLabel(m) {
  switch (m) {
    case RELAY_MODE_DISABLED:   return 'DISABLED';
    case RELAY_MODE_AUTO_HIGH:  return 'AUTO_HIGH';
    case RELAY_MODE_AUTO_LOW:   return 'AUTO_LOW';
    case RELAY_MODE_MANUAL_ON:  return 'MANUAL_ON';
    case RELAY_MODE_MANUAL_OFF: return 'MANUAL_OFF';
    default: return 'MODE_' + m;
  }
}

function renderRelayPanel() {
  const panel = document.getElementById('relayPanel');
  if (!panel) return;
  // Stay visible whenever the device exposes the enhanced feature set.
  // Relays are a standard feature; render an empty state when none are
  // configured rather than hiding the panel.
  if (!framedMode) {
    panel.style.display = 'none';
    return;
  }
  panel.style.display = '';
  const list = document.getElementById('relayList');

  if (!relayChar) {
    list.innerHTML = '<div class="empty-row">Relay channel not available on this device.</div>';
    return;
  }
  if (relayState.size === 0) {
    list.innerHTML = '<div class="empty-row">No relays configured. ' +
                     'Use the <code>RELAY</code> CLI command to assign a pin.</div>';
    return;
  }

  // Snapshot in-progress user edits BEFORE we blow away the DOM. Any row
  // that is either dirty (Apply pending) or currently focused must have its
  // control values + focus restored after the re-render, otherwise an
  // inbound confirmation notify would clobber a second edit the user
  // started before the round-trip completed.
  const liveEdits = new Map();
  for (const card of list.querySelectorAll('.relay-card')) {
    const idx = parseInt(card.dataset.relay, 10);
    const focusedEl = card.contains(document.activeElement) ? document.activeElement : null;
    if (!relayEditDirty.has(idx) && !focusedEl) continue;
    const modeSel = card.querySelector('.relay-mode');
    const onIn    = card.querySelector('.relay-thr-on');
    const offIn   = card.querySelector('.relay-thr-off');
    liveEdits.set(idx, {
      mode: modeSel ? modeSel.value : null,
      thrOn: onIn ? onIn.value : null,
      thrOff: offIn ? offIn.value : null,
      focusClass: focusedEl
          ? (focusedEl.classList.contains('relay-mode')   ? 'relay-mode'
            : focusedEl.classList.contains('relay-thr-on')  ? 'relay-thr-on'
            : focusedEl.classList.contains('relay-thr-off') ? 'relay-thr-off'
            : null)
          : null,
      caret: (focusedEl && typeof focusedEl.selectionStart === 'number')
          ? [focusedEl.selectionStart, focusedEl.selectionEnd] : null,
    });
    // Focused-without-dirty (user is mid-edit but hasn't tripped an
    // input event yet) still counts as in-progress; mark dirty so the
    // Apply button rebuilds in the enabled state.
    if (focusedEl) relayEditDirty.add(idx);
  }

  // Sort by relay index for stable ordering.
  const entries = [...relayState.entries()].sort((a, b) => a[0] - b[0]);
  let html = '';
  for (const [idx, r] of entries) {
    const onState = r.state === 1;
    const isAuto = r.mode === RELAY_MODE_AUTO_HIGH || r.mode === RELAY_MODE_AUTO_LOW;
    const dirty = relayEditDirty.has(idx);
    const ctx = (r.inputIndex !== 0xFF)
        ? 'bound to ' + escHtml(inputLabel(r.inputIndex))
        : 'unbound · pin ' + r.outputPin;
    html +=
      '<div class="relay-card" data-relay="' + idx + '">' +
        '<div class="relay-head">' +
          '<span class="relay-title">Relay ' + idx + '</span>' +
          '<span class="relay-context">' + ctx + '</span>' +
          '<span class="relay-pill ' + (onState ? 'on' : 'off') + '">' +
            (onState ? '● ON' : '○ OFF') +
          '</span>' +
        '</div>' +
        '<div class="relay-controls">' +
          '<div>' +
            '<label>Mode</label>' +
            '<select class="relay-mode">' +
              [0,1,2,3,4].map(m =>
                '<option value="' + m + '"' + (m === r.mode ? ' selected' : '') + '>' +
                modeLabel(m) + '</option>'
              ).join('') +
            '</select>' +
          '</div>' +
          '<div>' +
            '<label>Threshold ON</label>' +
            '<input type="number" step="0.1" class="relay-thr-on" ' +
              'value="' + (Number.isFinite(r.thresholdOn) ? r.thresholdOn : 0) + '" ' +
              (isAuto ? '' : 'disabled') + '>' +
          '</div>' +
          '<div>' +
            '<label>Threshold OFF</label>' +
            '<input type="number" step="0.1" class="relay-thr-off" ' +
              'value="' + (Number.isFinite(r.thresholdOff) ? r.thresholdOff : 0) + '" ' +
              (isAuto ? '' : 'disabled') + '>' +
          '</div>' +
          '<button class="relay-apply' + (dirty ? ' dirty' : '') + '"' +
            (dirty ? '' : ' disabled') + '>Apply</button>' +
        '</div>' +
      '</div>';
  }
  list.innerHTML = html;

  // Restore in-progress edits + focus + caret position before wiring events.
  for (const [idx, ed] of liveEdits) {
    const card = list.querySelector('.relay-card[data-relay="' + idx + '"]');
    if (!card) continue;
    const modeSel = card.querySelector('.relay-mode');
    const onIn    = card.querySelector('.relay-thr-on');
    const offIn   = card.querySelector('.relay-thr-off');
    if (modeSel && ed.mode !== null)  modeSel.value = ed.mode;
    if (onIn    && ed.thrOn !== null) onIn.value    = ed.thrOn;
    if (offIn   && ed.thrOff !== null) offIn.value  = ed.thrOff;
    // Thresholds follow current mode, not the inbound notify's mode.
    const newIsAuto = modeSel && (
        parseInt(modeSel.value, 10) === RELAY_MODE_AUTO_HIGH ||
        parseInt(modeSel.value, 10) === RELAY_MODE_AUTO_LOW);
    if (onIn)  onIn.disabled  = !newIsAuto;
    if (offIn) offIn.disabled = !newIsAuto;
    const apply = card.querySelector('.relay-apply');
    if (apply) {
      apply.classList.add('dirty');
      apply.disabled = false;
    }
    if (ed.focusClass) {
      const target = card.querySelector('.' + ed.focusClass);
      if (target) {
        target.focus();
        if (ed.caret && typeof target.setSelectionRange === 'function') {
          try { target.setSelectionRange(ed.caret[0], ed.caret[1]); } catch (e) {}
        }
      }
    }
  }

  // Wire per-row events. Doing it after insertion keeps the template literal
  // free of inline handlers (easier to escape correctly).
  for (const card of list.querySelectorAll('.relay-card')) {
    const idx = parseInt(card.dataset.relay, 10);
    const modeSel = card.querySelector('.relay-mode');
    const onIn    = card.querySelector('.relay-thr-on');
    const offIn   = card.querySelector('.relay-thr-off');
    const apply   = card.querySelector('.relay-apply');
    const markDirty = () => {
      relayEditDirty.add(idx);
      apply.classList.add('dirty');
      apply.disabled = false;
      // Toggle threshold enable state based on the new mode selection.
      const newIsAuto = parseInt(modeSel.value, 10) === RELAY_MODE_AUTO_HIGH ||
                        parseInt(modeSel.value, 10) === RELAY_MODE_AUTO_LOW;
      onIn.disabled = !newIsAuto;
      offIn.disabled = !newIsAuto;
    };
    modeSel.addEventListener('change', markDirty);
    onIn.addEventListener('input', markDirty);
    offIn.addEventListener('input', markDirty);
    apply.addEventListener('click', async () => {
      apply.disabled = true;
      try {
        const buf = new ArrayBuffer(16);
        const dv = new DataView(buf);
        dv.setUint8(0, 1);                              // protocolVersion
        dv.setUint8(1, idx);                            // relayIndex
        dv.setUint8(2, parseInt(modeSel.value, 10));    // mode
        dv.setUint8(3, 0);                              // state (read-only)
        dv.setUint8(4, 0xFF);                           // inputIndex (read-only via this path)
        dv.setUint8(5, 0xFF);                           // outputPin (read-only)
        dv.setUint16(6, 0, true);                       // sequence
        dv.setFloat32(8, parseFloat(onIn.value) || 0, true);
        dv.setFloat32(12, parseFloat(offIn.value) || 0, true);
        await relayChar.writeValueWithResponse(buf);
        relayEditDirty.delete(idx);
        apply.classList.remove('dirty');
        // Wait for the confirmation notify to redraw with the truth.
      } catch (e) {
        appendErr('Relay write failed: ' + e.message);
        apply.disabled = false;
      }
    });
  }
}

// Three-state badge:
//   "Live"     — Extended Service present AND a Status notify arrived
//                within LIVE_FRESHNESS_MS. Link is actually pushing data.
//   "Awaiting…" — Extended Service present but no recent status notify.
//                Most common cause: nRF advertises the binary chars but
//                host MCU is still in basic mode (no FRAMED ENABLE).
//   "Basic"    — No Extended Service (HM-10 / stock Bluefruit /
//                framed-disabled nRF). Text CLI only.
function updateFramedBadge() {
  const badge = document.getElementById('modeBadge');
  if (!badge) return;
  if (!device || !device.gatt || !device.gatt.connected) {
    badge.style.display = 'none';
    return;
  }
  badge.style.display = '';
  if (!framedMode) {
    badge.textContent = 'Basic';
    badge.className = 'mode-badge mode-basic';
    badge.title = 'Text command interface only. The connected device does not expose the enhanced binary characteristics.';
    return;
  }
  const fresh = lastStatusNotifyMs > 0 &&
                (Date.now() - lastStatusNotifyMs) < LIVE_FRESHNESS_MS;
  if (fresh) {
    badge.textContent = 'Live';
    badge.className = 'mode-badge mode-live';
    badge.title = 'Receiving real-time push updates from the device.';
  } else {
    badge.textContent = 'Awaiting…';
    badge.className = 'mode-badge mode-awaiting';
    badge.title = 'Enhanced characteristics are present but no live updates have arrived yet. ' +
                  'If this persists, the host MCU may still be in basic mode — try ' +
                  '`BUS SERIAL <port> FRAMED ENABLE` + SAVE + SYSTEM REBOOT in the terminal.';
  }
}

// Re-evaluate the badge once per second so a Live → Awaiting downgrade
// fires without waiting for another notify (which by definition won't
// arrive if the link has stalled).
setInterval(() => {
  if (device && device.gatt && device.gatt.connected && framedMode) {
    updateFramedBadge();
  }
}, 1000);

function formatUptime(seconds) {
  if (seconds < 60) return seconds + 's';
  if (seconds < 3600) return Math.floor(seconds / 60) + 'm ' + (seconds % 60) + 's';
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  return h + 'h ' + m + 'm';
}

// --- Terminal Output ---

function appendCmd(text) {
  const el = document.createElement('div');
  el.className = 'cmd';
  el.textContent = '> ' + text;
  output.appendChild(el);
  scrollToBottom();
}

function appendOutput(text) {
  const el = document.createElement('div');
  // Highlight error lines
  if (text.includes('ERROR:')) {
    el.className = 'err';
  }
  el.textContent = text;
  output.appendChild(el);
  scrollToBottom();
}

function appendInfo(text) {
  const el = document.createElement('div');
  el.className = 'info';
  el.textContent = text;
  output.appendChild(el);
  scrollToBottom();
}

function appendErr(text) {
  const el = document.createElement('div');
  el.className = 'err';
  el.textContent = text;
  output.appendChild(el);
  scrollToBottom();
}

function scrollToBottom() {
  output.scrollTop = output.scrollHeight;
}

// --- Command Queue ---

function sendQueued(cmd) {
  return new Promise((resolve, reject) => {
    cmdQueue.push({ cmd, resolve, reject });
    drainQueue();
  });
}

function drainQueue() {
  if (cmdPending || !cmdQueue.length || !txChar) return;
  const { cmd, resolve, reject } = cmdQueue.shift();
  cmdPending = true;
  pendingResolve = resolve;
  pendingReject = reject;
  sendText(cmd);
}

async function sendRaw(text) {
  if (!txChar) return;
  const data = ENCODER.encode(text);
  const chunkSize = 200;
  for (let i = 0; i < data.length; i += chunkSize) {
    const chunk = data.slice(i, i + chunkSize);
    try {
      await txChar.writeValueWithoutResponse(chunk);
    } catch(e) {
      try {
        await txChar.writeValue(chunk);
      } catch(e2) {
        throw new Error('BLE write failed at byte ' + i + ': ' + e2.message);
      }
    }
  }
}

// --- Config UI Helpers ---

function parseJsonResponse(raw) {
  const s = raw.trim();
  // Extract the outermost JSON object or array, skipping any stray log lines
  const objIdx = s.indexOf('{');
  const arrIdx = s.indexOf('[');
  const start = (objIdx === -1) ? arrIdx
              : (arrIdx === -1) ? objIdx
              : Math.min(objIdx, arrIdx);
  if (start === -1) throw new Error('No JSON found in response');
  const closer = s[start] === '{' ? '}' : ']';
  const end = s.lastIndexOf(closer);
  if (end <= start) throw new Error('Malformed JSON in response');
  return JSON.parse(s.slice(start, end + 1));
}

function pinNumToStr(pin) {
  if (pin >= 0xF0 && pin <= 0xFD) return 'I2C:' + (pin - 0xF0);
  if (pin >= 0xC0 && pin <= 0xDF) return 'CAN:' + (pin - 0xC0);
  return String(pin);
}

// Normalise unit display against the loaded catalog so casing is always canonical.
function normalizeUnitDisplay(units) {
  if (!units) return '—';
  const found = catalog.units.find(u => u.name.toLowerCase() === units.toLowerCase());
  return found ? found.name : units;
}

// Render an input's OBD-II PID assignment as a hex chip, or a dim dash when unset.
function formatPidCell(obd2) {
  const pid = obd2?.pid;
  if (!pid) return '<span class="pid-cell pid-cell-empty">—</span>';
  const hex = '0x' + pid.toString(16).toUpperCase().padStart(2, '0');
  const len = obd2.length || 1;
  return `<span class="pid-cell" title="${len} response byte${len === 1 ? '' : 's'}">${hex}<span class="pid-len">×${len}</span></span>`;
}

// --- Initial State Fetch ---

async function fetchInitialState() {
  const panel = document.getElementById('inputsPanel');
  const tbody = document.getElementById('inputsTbody');
  panel.style.display = '';
  tbody.innerHTML = '<tr><td colspan="10" class="empty-row" style="color:var(--brand)">Loading configuration…</td></tr>';
  try {
    // No CONFIG here: SYSTEM DUMP / LIST are RUN-legal, so the device stays
    // live while we load. CONFIG is entered only by withConfigMode() for the
    // actual write batches (Apply / Save / Revert / Import / Remove).
    const dumpResp = await sendQueued('SYSTEM DUMP JSON');
    originalConfig = parseJsonResponse(dumpResp);
    localConfig = JSON.parse(JSON.stringify(originalConfig));
    const appResp = await sendQueued('LIST APPLICATIONS JSON');
    catalog.applications = parseJsonResponse(appResp);
    const sensResp = await sendQueued('LIST SENSORS JSON');
    catalog.sensors = parseJsonResponse(sensResp);
    const unitResp = await sendQueued('LIST UNITS JSON');
    catalog.units = parseJsonResponse(unitResp);
    renderInputsPanel();
    appendInfo('Configuration loaded.');
  } catch(e) {
    tbody.innerHTML = '<tr><td colspan="10" class="empty-row" style="color:var(--red)">Failed to load: ' + escHtml(e.message) + '</td></tr>';
    if (e.message !== 'Disconnected') appendErr('Failed to load configuration: ' + e.message);
  }
}

// --- Inputs Table ---

function renderInputsPanel() {
  const tbody = document.getElementById('inputsTbody');
  tbody.innerHTML = '';
  const inputs = localConfig?.inputs || [];
  if (!inputs.length) {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td colspan="10" class="empty-row">No inputs configured. Click "+ Add Input" to add one.</td>';
    tbody.appendChild(tr);
  } else {
    for (const inp of inputs) {
      const pinStr = pinNumToStr(inp.pin);
      const state = inputState.get(pinStr);
      const alarmMin = inp.alarm?.min != null ? inp.alarm.min : '—';
      const alarmMax = inp.alarm?.max != null ? inp.alarm.max : '—';
      const badge = state === 'applied'
        ? '<span class="badge badge-applied">Applied</span>'
        : (state === 'dirty' ? '<span style="color:var(--dim);font-style:italic;font-size:11px">Pending</span>' : '—');
      const tr = document.createElement('tr');
      tr.innerHTML =
        `<td class="pin-cell">${escHtml(pinStr)}</td>` +
        `<td>${escHtml(inp.app || '—')}</td>` +
        `<td>${escHtml(inp.sensor || '—')}</td>` +
        `<td>${escHtml(normalizeUnitDisplay(inp.units))}</td>` +
        `<td>${alarmMin}</td>` +
        `<td>${alarmMax}</td>` +
        `<td>${formatPidCell(inp.obd2)}</td>` +
        `<td><input type="checkbox" ${inp.enabled ? 'checked' : ''} disabled></td>` +
        `<td>${badge}</td>` +
        `<td style="white-space:nowrap">` +
          `<button class="btn secondary row-btn" data-action="edit" data-pin="${escHtml(pinStr)}">Edit</button> ` +
          `<button class="btn row-btn" style="color:var(--red);border-color:rgba(160,48,48,0.4)" data-action="remove" data-pin="${escHtml(pinStr)}">Remove</button>` +
        `</td>`;
      tbody.appendChild(tr);
    }
  }
  const anyApplied = [...inputState.values()].some(s => s === 'applied');
  document.getElementById('unsavedBadge').style.display = anyApplied ? '' : 'none';
}

// Event delegation for table Edit / Remove buttons (avoids inline handlers with user data)
document.getElementById('inputsTbody').addEventListener('click', e => {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  const pin = btn.dataset.pin;
  if (btn.dataset.action === 'edit') openEditor(pin);
  else if (btn.dataset.action === 'remove') removeInput(pin);
});

// --- Input Editor ---

function buildEditorHTML(pinStr, inp, isAdd) {
  // Group applications by measurementType
  const groups = {};
  for (const app of catalog.applications) {
    const g = app.measurementType || 'OTHER';
    if (!groups[g]) groups[g] = [];
    groups[g].push(app);
  }
  let appOptions = '';
  for (const [g, apps] of Object.entries(groups).sort()) {
    appOptions += `<optgroup label="${g}">`;
    for (const app of apps) {
      const sel = inp && inp.app === app.name ? 'selected' : '';
      appOptions += `<option value="${escHtml(app.name)}" ${sel}>${escHtml(app.label || app.name)} (${escHtml(app.abbreviation || '')})</option>`;
    }
    appOptions += '</optgroup>';
  }

  const selectedApp = catalog.applications.find(a => inp && a.name === inp.app);
  const measType = selectedApp?.measurementType;
  const filtSensors = measType ? catalog.sensors.filter(s => s.measurementType === measType) : catalog.sensors;
  let sensOptions = '';
  for (const s of filtSensors) {
    const sel = inp && inp.sensor === s.name ? 'selected' : '';
    sensOptions += `<option value="${escHtml(s.name)}" ${sel}>${escHtml(s.label || s.name)}</option>`;
  }

  const filtUnits = measType ? catalog.units.filter(u => u.measurementType === measType) : catalog.units;
  let unitOptions = '';
  for (const u of filtUnits) {
    const sel = inp && inp.units === u.name ? 'selected' : '';
    const sym = u.symbol || u.alias || '';
    unitOptions += `<option value="${escHtml(u.name)}" ${sel}>${escHtml(u.name)}${sym ? ' (' + escHtml(sym) + ')' : ''}</option>`;
  }

  const alarmMin = inp?.alarm?.min != null ? inp.alarm.min : '';
  const alarmMax = inp?.alarm?.max != null ? inp.alarm.max : '';
  const enabled = inp ? inp.enabled !== false : true;
  const mask = inp?.outputMask ?? 0x0F;
  const obdPid = inp?.obd2?.pid ? '0x' + inp.obd2.pid.toString(16).toUpperCase().padStart(2, '0') : '';
  const obdLength = inp?.obd2?.length || 1;

  return `<div class="editor-title">${isAdd ? 'Add Input' : 'Edit Input: ' + escHtml(pinStr)}</div>
<div class="editor-grid">
  ${isAdd ? `<div class="editor-field">
    <label>Pin</label>
    <input type="text" id="edPin" value="${escHtml(pinStr)}" placeholder="e.g. A0, 14, I2C:0">
  </div>` : `<input type="hidden" id="edPin" value="${escHtml(pinStr)}">`}
  <div class="editor-field">
    <label>Application</label>
    <select id="edApp" onchange="updateEditorDropdowns()">${appOptions}</select>
  </div>
  <div class="editor-field">
    <label>Sensor</label>
    <select id="edSensor">${sensOptions}</select>
  </div>
  <div class="editor-field">
    <label>Units</label>
    <select id="edUnits">${unitOptions}</select>
  </div>
  <div class="editor-group">
    <div class="editor-field">
      <label>Alarm Min</label>
      <input type="number" id="edAlarmMin" value="${alarmMin}" placeholder="optional">
    </div>
    <div class="editor-field">
      <label>Alarm Max</label>
      <input type="number" id="edAlarmMax" value="${alarmMax}" placeholder="optional">
    </div>
  </div>
  <div class="editor-group">
    <div class="editor-field">
      <label>OBD-II PID</label>
      <input type="text" id="edObdPid" value="${escHtml(obdPid)}" placeholder="0x00 (none)" pattern="^(0[xX][0-9a-fA-F]{1,2}|[0-9]{1,3})?$" oninput="document.getElementById('edObdLength').disabled = !this.value.trim()">
    </div>
    <div class="editor-field">
      <label>OBD Response Bytes</label>
      <input type="number" id="edObdLength" value="${obdLength}" min="1" max="5" ${obdPid ? '' : 'disabled'}>
    </div>
  </div>
  <div class="editor-field" style="grid-column: 1 / -1;">
    <label>Status &amp; Outputs</label>
    <div class="editor-toggle-row">
      <label><input type="checkbox" id="edEnabled" ${enabled ? 'checked' : ''}> Input Enabled</label>
      <span class="editor-toggle-divider"></span>
      <label><input type="checkbox" id="edOutCAN"      ${mask & 1 ? 'checked' : ''}> CAN</label>
      <label><input type="checkbox" id="edOutRealDash" ${mask & 2 ? 'checked' : ''}> RealDash</label>
      <label><input type="checkbox" id="edOutSerial"   ${mask & 4 ? 'checked' : ''}> Serial</label>
      <label><input type="checkbox" id="edOutSD"       ${mask & 8 ? 'checked' : ''}> SD Log</label>
    </div>
  </div>
</div>
<div class="editor-actions">
  <button class="btn primary" onclick="saveEditorLocal()">Save</button>
  <button class="btn secondary" onclick="closeEditor()">Cancel</button>
</div>`;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function openEditor(pinStr) {
  editingPin = pinStr;
  const inp = localConfig.inputs.find(i => pinNumToStr(i.pin) === pinStr);
  const editor = document.getElementById('inputEditor');
  editor.innerHTML = buildEditorHTML(pinStr, inp, false);
  updateEditorDropdowns();
  editor.style.display = '';
  editor.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function openAddEditor() {
  editingPin = null;
  const editor = document.getElementById('inputEditor');
  editor.innerHTML = buildEditorHTML('', null, true);
  updateEditorDropdowns();
  editor.style.display = '';
  editor.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function closeEditor() {
  document.getElementById('inputEditor').style.display = 'none';
  editingPin = null;
}

function updateEditorDropdowns() {
  const appName = document.getElementById('edApp').value;
  const appObj = catalog.applications.find(a => a.name === appName);
  const measType = appObj?.measurementType;

  const filtSensors = measType ? catalog.sensors.filter(s => s.measurementType === measType) : catalog.sensors;
  const sensEl = document.getElementById('edSensor');
  const curSens = sensEl.value;
  sensEl.innerHTML = '';
  for (const s of filtSensors) {
    const opt = document.createElement('option');
    opt.value = s.name;
    opt.textContent = s.label || s.name;
    if (s.name === curSens) opt.selected = true;
    sensEl.appendChild(opt);
  }
  if (appObj?.defaultSensor && !filtSensors.find(s => s.name === sensEl.value)) {
    sensEl.value = appObj.defaultSensor;
  }

  const filtUnits = measType ? catalog.units.filter(u => u.measurementType === measType) : catalog.units;
  const unitEl = document.getElementById('edUnits');
  const curUnit = unitEl.value;
  unitEl.innerHTML = '';
  for (const u of filtUnits) {
    const opt = document.createElement('option');
    opt.value = u.name;
    opt.textContent = u.name + (u.symbol ? ' (' + u.symbol + ')' : '');
    if (u.name === curUnit) opt.selected = true;
    unitEl.appendChild(opt);
  }
  if (appObj?.defaultUnits && !filtUnits.find(u => u.name === unitEl.value)) {
    unitEl.value = appObj.defaultUnits;
  }
}

function saveEditorLocal() {
  const isAdd = editingPin === null;
  const newPin = document.getElementById('edPin').value.trim();
  if (!newPin) { alert('Pin is required.'); return; }
  if (!/^[A-Za-z0-9:]+$/.test(newPin)) { alert('Invalid pin format. Use A0, 14, I2C:0, CAN:0, etc.'); return; }

  const alarmMinRaw = document.getElementById('edAlarmMin').value;
  const alarmMaxRaw = document.getElementById('edAlarmMax').value;
  const hasMin = alarmMinRaw !== '';
  const hasMax = alarmMaxRaw !== '';
  if (hasMin !== hasMax) { alert('Set both Alarm Min and Max, or leave both empty.'); return; }

  const obdPidRaw = document.getElementById('edObdPid').value.trim();
  let obdPid = 0;
  if (obdPidRaw) {
    obdPid = /^0[xX]/.test(obdPidRaw) ? parseInt(obdPidRaw, 16) : parseInt(obdPidRaw, 10);
    if (!Number.isInteger(obdPid) || obdPid < 0 || obdPid > 0xFF) {
      alert('OBD-II PID must be 0x00–0xFF (or 0–255).');
      return;
    }
  }
  const obdLength = Math.min(5, Math.max(1, Number(document.getElementById('edObdLength').value) || 1));

  const changes = {
    app: document.getElementById('edApp').value,
    sensor: document.getElementById('edSensor').value,
    units: document.getElementById('edUnits').value,
    alarm: {
      min: hasMin ? Number(alarmMinRaw) : null,
      max: hasMax ? Number(alarmMaxRaw) : null,
    },
    enabled: document.getElementById('edEnabled').checked,
    outputMask:
      (document.getElementById('edOutCAN').checked      ? 1 : 0) |
      (document.getElementById('edOutRealDash').checked ? 2 : 0) |
      (document.getElementById('edOutSerial').checked   ? 4 : 0) |
      (document.getElementById('edOutSD').checked       ? 8 : 0),
    obd2: obdPid ? { pid: obdPid, length: obdLength } : { pid: 0, length: 0 },
  };

  if (isAdd) {
    if (localConfig.inputs.some(i => pinNumToStr(i.pin) === newPin || i.pin === newPin)) {
      alert('Pin ' + newPin + ' is already configured. Edit the existing row instead.');
      return;
    }
    localConfig.inputs.push({ pin: newPin, ...changes });
    inputState.set(newPin, 'dirty');
  } else {
    const inp = localConfig.inputs.find(i => pinNumToStr(i.pin) === editingPin);
    if (inp) Object.assign(inp, changes);  // preserve inp.pin (numeric)
    inputState.set(editingPin, 'dirty');
  }
  renderInputsPanel();
  closeEditor();
}

// --- Apply / Save / Revert ---

async function sendChecked(cmd) {
  const resp = await sendQueued(cmd);
  if (/(^|\n)ERROR:/.test(resp)) throw new Error(resp.trim());
  return resp;
}

// Read the device's current mode from the cached System Status characteristic.
// Returns 'CONFIG', 'RUN', or null when status isn't available (transparent
// NUS/HM-10 link, or the status char is absent). A direct read of the 32-byte
// cache, so it reflects the device's actual mode now — no dependence on the
// last async status notify, which would race a just-pressed mode button.
async function readDeviceMode() {
  if (!statusChar) return null;
  try {
    const val = await statusChar.readValue();
    if (val.byteLength < 32) return null;
    if (val.getUint32(0, true) !== 0x704F4244) return null;  // "pOBD" magic
    return val.getUint8(5) === 0 ? 'CONFIG' : 'RUN';
  } catch (_) { return null; }
}

// Run a batch of config-gated writes inside a CONFIG-mode window, then restore
// whatever mode the device was in beforehand — "leave it alone". A write
// requires CONFIG, but entering it is an implicit means to an end, not a user
// choice: only the manual CONFIG/RUN buttons set the resting mode. So if the
// device was already in CONFIG (the user picked it, or a serial-only rig
// booted that way) we leave it there; if it was in RUN we return to RUN.
//
// RUN is still the webapp's default resting state — it never enters CONFIG on
// connect or while idle (fetchInitialState reads in RUN; SYSTEM DUMP / LIST
// are RUN-legal). This restore only governs what happens *after* a write
// batch, and never overrides an explicit manual mode choice. Defaults to RUN
// when the prior mode can't be read. Firmware-side dissolution of the
// CONFIG-mode global freeze (so writes don't stop the world at all) is tracked
// separately — see #268.
async function withConfigMode(fn) {
  const priorMode = await readDeviceMode();   // capture before we touch it
  await sendChecked('CONFIG');                 // idempotent if already CONFIG
  try {
    return await fn();
  } finally {
    // Restore the prior mode rather than forcing RUN, so we don't yank the
    // user out of a CONFIG they explicitly chose. Only skip the RUN restore
    // when we know we started in CONFIG; unknown prior mode defaults to RUN.
    if (priorMode !== 'CONFIG') {
      try { await sendChecked('RUN'); } catch (_) { /* best-effort */ }
    }
  }
}

async function applyInput(pinStr) {
  const cur = localConfig.inputs.find(i => pinNumToStr(i.pin) === pinStr || i.pin === pinStr);
  const orig = originalConfig?.inputs?.find(i => pinNumToStr(i.pin) === pinStr || i.pin === pinStr);
  if (!cur) return false;
  try {
    if (!orig || cur.app !== orig.app)
      await sendChecked('SET ' + pinStr + ' APPLICATION ' + cur.app);
    if (!orig || cur.sensor !== orig.sensor)
      await sendChecked('SET ' + pinStr + ' SENSOR ' + cur.sensor);
    if (!orig || cur.units !== orig.units)
      await sendChecked('SET ' + pinStr + ' UNITS ' + cur.units);

    const alarmChanged = !orig ||
      cur.alarm?.min !== orig.alarm?.min ||
      cur.alarm?.max !== orig.alarm?.max;
    if (alarmChanged) {
      if (cur.alarm?.min != null && cur.alarm?.max != null)
        await sendChecked('SET ' + pinStr + ' ALARM ' + cur.alarm.min + ' ' + cur.alarm.max);
      else if (cur.alarm?.min == null && cur.alarm?.max == null)
        await sendChecked('SET ' + pinStr + ' ALARM DISABLE');
    }

    if (!orig || cur.enabled !== orig.enabled)
      await sendChecked('SET ' + pinStr + ' INPUT ' + (cur.enabled ? 'ENABLE' : 'DISABLE'));

    const OUTPUT_TARGETS = ['CAN', 'REALDASH', 'SERIAL', 'SD_LOG'];
    const curMask  = cur.outputMask  ?? 0x0F;
    const origMask = orig?.outputMask ?? 0x0F;
    if (curMask !== origMask) {
      for (let bit = 0; bit < 4; bit++) {
        if (((curMask >> bit) & 1) !== ((origMask >> bit) & 1)) {
          await sendChecked(`SET ${pinStr} OUTPUT ${OUTPUT_TARGETS[bit]} ${(curMask >> bit) & 1 ? 'ENABLE' : 'DISABLE'}`);
        }
      }
    }

    // OBD-II PID / response length — PID first, since clearing it (0x00) makes
    // length irrelevant, and setting a fresh PID is what makes length apply.
    const curObd  = cur.obd2  || { pid: 0, length: 0 };
    const origObd = orig?.obd2 || { pid: 0, length: 0 };
    if (curObd.pid !== origObd.pid) {
      await sendChecked(`SET ${pinStr} OBD_PID 0x${curObd.pid.toString(16).toUpperCase().padStart(2, '0')}`);
    }
    if (curObd.pid !== 0 && curObd.length !== origObd.length) {
      await sendChecked(`SET ${pinStr} OBD_LENGTH ${curObd.length}`);
    }

    // Mirror applied state into originalConfig so subsequent diffs are accurate
    if (orig) {
      Object.assign(orig, { app: cur.app, sensor: cur.sensor, units: cur.units,
        alarm: { min: cur.alarm?.min ?? null, max: cur.alarm?.max ?? null },
        enabled: cur.enabled, outputMask: curMask, obd2: { ...curObd } });
    } else if (originalConfig?.inputs) {
      originalConfig.inputs.push(JSON.parse(JSON.stringify(cur)));
    }
    inputState.set(pinStr, 'applied');
    return true;
  } catch(e) {
    appendErr('Apply failed for pin ' + pinStr + ': ' + e.message);
    return false;
  }
}

// Disable action buttons while an async operation is running to prevent double-fire
const CONFIG_ACTION_IDS = ['btnApply', 'btnSaveEEPROM', 'btnRevert', 'btnExportJSON'];
function setConfigBusy(busy) {
  CONFIG_ACTION_IDS.forEach(id => { document.getElementById(id).disabled = busy; });
  document.getElementById('importFile').disabled = busy;
}

document.getElementById('btnApply').addEventListener('click', async () => {
  const dirty = [...inputState.entries()].filter(([,s]) => s === 'dirty').map(([p]) => p);
  if (!dirty.length) { appendInfo('No pending changes to apply.'); return; }
  setConfigBusy(true);
  try {
    let allOk = true;
    await withConfigMode(async () => {
      for (const pin of dirty) { if (!await applyInput(pin)) allOk = false; }
    });
    renderInputsPanel();
    if (allOk) appendInfo('Changes applied to device RAM. Click "Save to EEPROM" to persist.');
    else appendErr('Some inputs failed to apply — check terminal for details.');
  } catch(e) {
    appendErr('Apply failed: ' + e.message);
  } finally {
    setConfigBusy(false);
  }
});

document.getElementById('btnSaveEEPROM').addEventListener('click', async () => {
  const dirty = [...inputState.values()].filter(s => s === 'dirty');
  if (dirty.length && !confirm('You have unapplied edits. Apply them now before saving?')) return;
  setConfigBusy(true);
  try {
    await withConfigMode(async () => {
      if (dirty.length) {
        const pins = [...inputState.entries()].filter(([,s]) => s === 'dirty').map(([p]) => p);
        let allOk = true;
        for (const pin of pins) { if (!await applyInput(pin)) allOk = false; }
        if (!allOk) { appendErr('Save aborted: some inputs failed to apply.'); renderInputsPanel(); return; }
      }
      await sendChecked('SAVE');
      originalConfig = JSON.parse(JSON.stringify(localConfig));
      inputState.clear();
      renderInputsPanel();
      appendInfo('Configuration saved to EEPROM.');
    });
  } catch(e) {
    appendErr('Save failed: ' + e.message);
  } finally {
    setConfigBusy(false);
  }
});

document.getElementById('btnRevert').addEventListener('click', async () => {
  const anyApplied = [...inputState.values()].some(s => s === 'applied');
  if (anyApplied && !confirm('Reload from EEPROM? This will discard applied-but-unsaved changes.')) return;
  setConfigBusy(true);
  try {
    await withConfigMode(() => sendChecked('LOAD EEPROM'));
    inputState.clear();
    await fetchInitialState();   // reload in RUN (reads are RUN-legal)
  } catch(e) {
    appendErr('Revert failed: ' + e.message);
  } finally {
    setConfigBusy(false);
  }
});

// --- Export / Import ---

document.getElementById('btnExportJSON').addEventListener('click', async () => {
  setConfigBusy(true);
  try {
    const resp = await sendQueued('SYSTEM DUMP JSON');
    const blob = new Blob([resp.trim()], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'preobd-config-' + new Date().toISOString().slice(0,19).replace(/:/g,'-') + '.json';
    a.click();
  } catch(e) {
    appendErr('Export failed: ' + e.message);
  } finally {
    setConfigBusy(false);
  }
});

document.getElementById('importFile').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  setConfigBusy(true);
  try {
    const text = await file.text();
    let parsed;
    try { parsed = JSON.parse(text); } catch { appendErr('Invalid JSON file.'); return; }
    if (!parsed.schemaVersion) { appendErr('Not a preOBD config file (missing schemaVersion).'); return; }
    if (!confirm('Import will overwrite current device RAM config. Continue?')) return;

    await withConfigMode(async () => {
      await sendChecked('JSON IMPORT');
      suppressOutput = true;
      appendInfo('Streaming ' + text.length + ' bytes…');
      await sendRaw(text);
      const result = await sendQueued('END JSON');
      suppressOutput = false;
      if (result.trim()) appendOutput(result.trim());
      if (/(^|\n)ERROR:/.test(result)) throw new Error(result.trim());

      if (confirm('Import complete. Save to EEPROM now?')) {
        await sendChecked('SAVE');
      }
    });
    await fetchInitialState();   // reload in RUN (reads are RUN-legal)
  } catch(e) {
    suppressOutput = false;
    appendErr('Import failed: ' + e.message);
  } finally {
    setConfigBusy(false);
    e.target.value = '';
  }
});

// --- Terminal collapse ---

document.getElementById('terminalHeader').addEventListener('click', () => {
  const terminal = document.getElementById('terminal');
  const btn = document.getElementById('btnTerminalToggle');
  const collapsed = terminal.classList.toggle('collapsed');
  btn.textContent = collapsed ? '▼' : '▲';
  btn.title = collapsed ? 'Expand terminal' : 'Collapse terminal';
});

// Collapse handlers for alarm + relay panels — same pattern as terminal.
function wirePanelCollapse(headerId, panelId, btnId, label) {
  const header = document.getElementById(headerId);
  if (!header) return;
  header.addEventListener('click', (e) => {
    // Ignore clicks on interactive children so dropdowns/inputs still work.
    if (e.target.closest('button, select, input, a, label')) return;
    const panel = document.getElementById(panelId);
    const btn = document.getElementById(btnId);
    const collapsed = panel.classList.toggle('collapsed');
    btn.textContent = collapsed ? '▼' : '▲';
    btn.title = (collapsed ? 'Expand ' : 'Collapse ') + label;
  });
}
wirePanelCollapse('alarmPanelHeader', 'alarmPanel', 'btnAlarmToggle', 'alarms');
wirePanelCollapse('relayPanelHeader', 'relayPanel', 'btnRelayToggle', 'relays');

// --- Add / Remove ---

document.getElementById('btnAddInput').addEventListener('click', openAddEditor);

async function removeInput(pinStr) {
  if (!confirm('Remove input on pin ' + pinStr + '?')) return;
  try {
    await withConfigMode(() => sendChecked('CLEAR ' + pinStr));
  } catch(e) {
    appendErr('Remove failed: ' + e.message);
    return;
  }
  localConfig.inputs = localConfig.inputs.filter(i => pinNumToStr(i.pin) !== pinStr && i.pin !== pinStr);
  if (originalConfig?.inputs)
    originalConfig.inputs = originalConfig.inputs.filter(i => pinNumToStr(i.pin) !== pinStr && i.pin !== pinStr);
  inputState.delete(pinStr);
  renderInputsPanel();
}
