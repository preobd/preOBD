; preOBD nRF52840 firmware -- separate project from main MCU firmware.
;
; Phase 1: BLE <-> UART transparent bridge on Adafruit ItsyBitsy nRF52840.
; Production target (MDBT50Q on preOBD PCB) is added in Phase 3.

[env:itsybitsy_nrf52840]
platform = nordicnrf52
board = adafruit_itsybitsy_nrf52840
framework = arduino
; Bluefruit / BLEDfu / SoftDevice S140 are part of the
; framework-arduinoadafruitnrf52 package -- no lib_deps needed.
build_flags =
    -DBOARD_ITSYBITSY
    -DDEBUG_SERIAL=1
    ; Bump Adafruit nRF52 BSP's HardwareSerial ring buffer past the 64-byte
    ; default (couples RX + TX). 8KB gives a comfortable cushion against
    ; transient BLE drain stalls without leaning on it for correctness --
    ; the GPIO-pace flow control below keeps Serial1 fill bounded near the
    ; 256B high-water mark regardless of how long the dump runs. Costs
    ; ~16KB RAM (RX + TX rings).
    -DSERIAL_BUFFER_SIZE=8192
    ; Phase 3 -- software-paced flow control on the host-MCU UART link.
    ; Uncomment and fill in the GPIOs wired to the host's CTS/RTS lines.
    ; Both must be defined together to enable flow control; leaving them
    ; undefined yields a no-op build identical to Phase 2. See
    ; src/board_pins.h for the pin semantics.
    ; -D PIN_NRF_RTS_OUT=<pin>   ; nRF drives, host reads (host's CTS-in)
    ; -D PIN_NRF_CTS_IN=<pin>    ; nRF reads, host drives (host's RTS-out)
monitor_speed = 115200
extra_scripts = pre:../scripts/sync_gatt_defs.py
