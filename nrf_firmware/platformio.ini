; preOBD nRF52840 firmware -- separate project from main MCU firmware.
;
; Phase 1: BLE <-> UART transparent bridge on Adafruit ItsyBitsy nRF52840.
; Production target (MDBT50Q on preOBD PCB) is added in Phase 3.

[env:itsybitsy_nrf52840]
platform = nordicnrf52
board = adafruit_itsybitsy_nrf52840
framework = arduino
; Bluefruit / BLEDfu / SoftDevice S140 are part of the
; framework-arduinoadafruitnrf52 package -- no lib_deps needed.
build_flags =
    -DBOARD_ITSYBITSY
    -DDEBUG_SERIAL=1
    ; Bump Adafruit nRF52 BSP's HardwareSerial ring buffer from 64 to 2048
    ; bytes (couples RX + TX). At 115200 baud the default 64-byte RX buffer
    ; overflows in ~5ms; Bluefruit's notify() can block up to 100ms waiting
    ; for an HVN packet, so we need >=1440 bytes of headroom to avoid UART-
    ; level data loss for VERSION-class responses. Costs ~4KB RAM. Still
    ; complements (not replaces) hardware flow control in Phase 3.
    -DSERIAL_BUFFER_SIZE=2048
monitor_speed = 115200
extra_scripts = pre:../scripts/sync_gatt_defs.py
