; preOBD nRF52840 firmware -- separate project from main MCU firmware.
;
; Phase 1: BLE <-> UART transparent bridge on Adafruit ItsyBitsy nRF52840.
; Production target (MDBT50Q on preOBD PCB) is added in Phase 3.

[platformio]
; Bench-specific overrides (flow-control GPIO pin assignments, etc.) live in
; a gitignored `platformio_local.ini` and are merged in here when present.
; See `platformio_local.ini.example` for the template. Without that file,
; the [bench_local] defaults below are picked up and resolve to empty.
extra_configs = platformio_local.ini

; ============================================================================
; BENCH-LOCAL OVERRIDES (defaults — overridden by platformio_local.ini)
; ============================================================================

[bench_local]
; Software flow control wired between nRF52840 and Teensy host. Define both
; pins or neither — the nRF firmware compiles to a no-op when either is
; undefined. Pin numbers are nRF GPIOs (digital pin index).
nrf_flow_control =

[env:itsybitsy_nrf52840]
platform = nordicnrf52
board = adafruit_itsybitsy_nrf52840
framework = arduino
; Bluefruit / BLEDfu / SoftDevice S140 are part of the
; framework-arduinoadafruitnrf52 package -- no lib_deps needed.
build_flags =
    -DBOARD_ITSYBITSY
    -DDEBUG_SERIAL=1
    ; Bump Adafruit nRF52 BSP's HardwareSerial ring buffer past the 64-byte
    ; default (couples RX + TX). 8KB gives a comfortable cushion against
    ; transient BLE drain stalls without leaning on it for correctness --
    ; the GPIO-pace flow control below keeps Serial1 fill bounded near the
    ; 256B high-water mark regardless of how long the dump runs. Costs
    ; ~16KB RAM (RX + TX rings).
    -DSERIAL_BUFFER_SIZE=8192
    ; Phase 3 -- software-paced flow control on the host-MCU UART link.
    ; Pin assignments are bench-specific; set both in platformio_local.ini
    ; (gitignored) -- see platformio_local.ini.example for the template.
    ; Leaving them undefined yields a no-op build identical to Phase 2. See
    ; src/board_pins.h for the pin semantics.
    ${bench_local.nrf_flow_control}
monitor_speed = 115200
extra_scripts =
    pre:../scripts/version_inject.py
    pre:../scripts/sync_gatt_defs.py
